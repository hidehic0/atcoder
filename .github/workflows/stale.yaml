name: close daily_virtual_contests issue
on:
  push:
    paths:
      - .github/workflows/stale.yaml
  schedule:
    - cron: "0 3 * * *"

jobs:
  close-issues:
    permissions:
      actions: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          only-labels: daily_virtual_contests
          days-before-stale: 1
          days-before-close: 0
          close-issue-label: Stale
